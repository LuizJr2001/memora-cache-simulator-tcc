name: Memora Tela 1 - layout e capturas
on:
  push:
    branches:
      - feature/35-tela-1
    paths:
      - .github/workflows/memora-tela1-layout.yml
      - packages/memora/src/styles/base.css
      - packages/memora/browser/configure.spec.js

permissions:
  contents: write

jobs:
  verificar-tela-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Testes visuais e capturas Chromium
        run: npm run test:ui --workspace @memora/simulator
        env:
          MEMORA_SCREENSHOT_DIR: packages/memora/docs/screenshots/tela-1
      - run: git diff --check
      - name: Publicar capturas da tela na branch do PR
        run: |
          if git diff --quiet -- packages/memora/docs/screenshots/tela-1; then
            echo "Nenhuma captura alterada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/memora/docs/screenshots/tela-1
          git commit -m "test(ui): renovar capturas da Tela 1 [skip ci]"
          git push
