name: Regressão Playwright
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Executar suíte integral e guardar evidências
        working-directory: packages/memora
        env:
          MEMORA_SCREENSHOT_DIR: ${{ github.workspace }}/evidencias/configurar
          MEMORA_SIMULATION_SCREENSHOT_DIR: ${{ github.workspace }}/evidencias/simular
          MEMORA_ANALYSIS_SCREENSHOT_DIR: ${{ github.workspace }}/evidencias/comparacao
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/evidencias/resultados.json
        run: npx playwright test --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidencias
          path: |
            evidencias/
            packages/memora/test-results/
          retention-days: 14
