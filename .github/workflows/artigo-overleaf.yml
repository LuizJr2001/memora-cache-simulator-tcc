name: Artigo abnTeX2 e Overleaf (#84)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tcc/**'
      - '.github/workflows/artigo-overleaf.yml'
  push:
    branches: [docs/84-fechamento-artigo-overleaf, main]
    paths:
      - 'tcc/**'
      - '.github/workflows/artigo-overleaf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artigo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar TeX e utilitários
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-lang-portuguese texlive-fonts-recommended texlive-bibtex-extra texlive-publishers texlive-humanities poppler-utils
      - name: Gerar pacote Overleaf
        run: python3 tcc/empacotar_artigo.py
      - name: Compilar artigo
        working-directory: tcc/artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Verificar PDF e ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from subprocess import check_output
          log=Path('tcc/artigo/main.log').read_text(errors='replace')
          if 'There were undefined references' in log or 'There were undefined citations' in log:
              raise SystemExit('Há referências ou citações indefinidas')
          pdf=Path('tcc/artigo/main.pdf')
          assert pdf.is_file() and pdf.stat().st_size>10000
          pages=check_output(['pdftotext','-layout',str(pdf),'-']).decode(errors='replace').split('\f')
          names=['Apêndice A','Apêndice B','Apêndice C','Apêndice D','Anexo A']
          for name in names:
              indices=[i+1 for i,p in enumerate(pages) if name in p]
              assert indices, f'Seção não encontrada: {name}'
              print(name,indices)
          with ZipFile('tcc/tcc-atual.zip') as z:
              got=set(z.namelist())
              required={'main.tex','referencias.bib','secoes/metodologia.tex','secoes/avaliacao.tex',
              'figuras/manual/configurar.png','figuras/manual/simular.png',
              'figuras/manual/comparacao.png','figuras/manual/conclusao.png','figuras/avaliacao-rapida.pdf'}
              assert required<=got, f'ZIP incompleto: {required-got}'
              print('ZIP',len(got),'arquivos')
          print('PDF',len(pages)-1,'páginas')
          PY
      - name: Entregar PDF e ZIP
        uses: actions/upload-artifact@v4
        with:
          name: memora-artigo-84-pdf-overleaf
          path: |
            tcc/artigo/main.pdf
            tcc/tcc-atual.zip
          if-no-files-found: error
          retention-days: 30
